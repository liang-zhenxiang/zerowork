# electron-builder 配置
#
# 用 YAML 而不是 .js / .mjs：配置文件的 CJS/ESM 之争是一个已知的坑区
# （本项目是 `"type": "module"`，JS 配置需要走 dynamic import 才被识别）。
# YAML 绕开整个问题。
#
# 文档：https://www.electron.build/configuration/configuration

# 反向域名形式：io.github.<owner>.<repo>。
# 换个 owner 时这里要跟着改 —— 它是**安装包的身份**，不是展示名。
appId: io.github.liang-zhenxiang.zerowork
productName: ZeroWork
# 版权署名与 LICENSE 附录保持一致（**归属声明**，不是维护者名单）；
# 维护者是另外两位，写在 package.json 的 author / contributors 与 docs/MAINTAINER_GUIDE.md
copyright: Copyright 2026 ZeroWork

directories:
  output: release
  # 图标等构建资源目录。**这里不要放别的图片** ——
  # electron-builder 会把目录里每张图当候选图标，尺寸不足就报错。
  buildResources: build

# ---------------------------------------------------------------------------
# 打包哪些文件
#
# 默认 files 是 `**/*`，而 electron-builder **不读 .gitignore** ——
# 不显式限定的话，tests/、docs/、artifacts/（测试截图）都会被塞进产物，
# 而且 resources/ 会被**再打一份**（它已经通过 extraResources 进去了）。
#
# 生产依赖（node_modules）由 electron-builder 按 package.json 自动带上，
# 不受这里的 patterns 影响 —— 这一点很关键：`electron.vite.config.mjs` 用了
# externalizeDepsPlugin()，daemon 产物里是裸 `import "@earendil-works/pi-coding-agent"`，
# 运行时真的需要 node_modules。
# ---------------------------------------------------------------------------
files:
  - out/**
  - package.json
  - "!**/*.map"
  # -------------------------------------------------------------------------
  # 下面五条排除规则（四类）排除的是**我们用不到、但会被依赖树捎带进来**的东西。
  #
  # ⚠️ 每一条**都不是洁癖，也不是省事的优化** —— 每一条都对应一个明确的判断，
  #    改之前请先读 `docs/MAINTAINER_GUIDE.md` 的「随包依赖的取舍」一节。
  #
  # ① tesseract.js / tesseract.js-core（约 50 MB）
  #    来自 `officeparser → tesseract.js`，只在 **OCR 扫描件识别**时才会被加载。
  #    而本项目**不做 OCR**（Roadmap 的「不做」清单；`src/main/daemon/doc-extract.js`
  #    对没有文本层的 PDF 直接抛 `scanned` 错误，从不对 PDF 走 OCR）。
  #    officeparser 侧是**懒加载**（`await import("tesseract.js")` 在
  #    `utils/ocrUtils.js` 的 `createAndRunWorker` 里，且 `defaults.js` 的
  #    `ocr: false` 是默认值，我们调用 `parseOffice(path)` 时没传选项），
  #    所以删掉它不会影响任何**我们真正走**的代码路径。
  #
  #    ⚠️ 代价（有意接受）：万一将来有人开启 OCR，报错会是
  #    「Cannot find module 'tesseract.js'」—— 这是**响亮的失败**，不是静默降级。
  #    真要恢复 OCR，请连同 Roadmap 的「不做」条目一起改。
  #
  # ② @napi-rs/canvas（约 27 MB）
  #    是 `pdfjs-dist` 的 **optionalDependencies**（Node 端把页面渲染成 canvas 用）。
  #    我们只调 `page.getTextContent()` 取文本，**从不渲染**。
  #    实测（去掉该包后跑 pdfjs 取文本）正文照常取出，只多出两条
  #    「Cannot polyfill DOMMatrix / Path2D，rendering may be broken」警告 ——
  #    警告是**渲染**路径的事，与取文本无关。
  #    pdfjs 自己对它的加载就是 try/catch + warn，缺了不报错。
  #
  # ③ officeparser 的浏览器构建（约 30 MB）
  #    `dist/officeparser.browser*.mjs/.iife.js` 五个文件，是给**浏览器**用的
  #    （package.json 的 `exports` 里挂在 `browser` 条件下）。Node 侧入口
  #    `dist/index.js` 只 require 同目录的 `./OfficeParser.js` 等五个 .js，
  #    全包内**没有任何一处**引用 browser 那五个文件名（已 grep 核实）。
  #    Electron 主进程走的是 Node 解析，`browser` 条件不参与 —— 这五个文件
  #    在产物里是纯占位。
  #
  # ④ pdfjs-dist 的**非 legacy** 构建（约 6.7 MB）
  #    我们只 import `pdfjs-dist/legacy/build/pdf.mjs` 与 `.../pdf.worker.mjs`
  #    （见 src/main/daemon/doc-extract.js），另加 `pdfjs-dist/package.json`
  #    用于定位 cmaps / standard_fonts。`build/`（非 legacy）没有任何引用点，
  #    legacy 那两份产物也不 import 它（已核实内部无相对 import）。
  #    ⚠️ 改这里之前请重新 grep 一遍 `out/main`：
  #       grep -rhoE "pdfjs-dist[/\"'][^\"')]*" out/main/*.mjs | sort -u
  # -------------------------------------------------------------------------
  - "!node_modules/tesseract.js/**"
  - "!node_modules/tesseract.js-core/**"
  - "!node_modules/@napi-rs/**"
  - "!node_modules/officeparser/dist/officeparser.browser*"
  - "!node_modules/pdfjs-dist/build/**"

# ---------------------------------------------------------------------------
# resources/ 必须在 asar 之外
#
# 两个原因，都不是洁癖：
#   ① 里面的二进制（resources/bin/*.exe）要被 spawn —— asar 内的路径不是真实文件路径
#   ② 打包态的代码按 `join(process.resourcesPath, "resources")` 找它
#      （见 src/main/index.js），而 process.resourcesPath 指向 app 的资源目录
# ---------------------------------------------------------------------------
extraResources:
  - from: resources
    to: resources

# ---------------------------------------------------------------------------
# 真源是 `npm run build` 的产物 out/。
# 这里只做一次「产物存在吗」的保险 —— 忘了构建就打包会产出一个跑不起来的安装包，
# 而那比打包失败更糟（用户装完才发现）。
# ---------------------------------------------------------------------------
beforePack: scripts/before-pack.cjs

# afterPack：① 裁剪 @esbuild 的跨平台二进制（只留打包目标平台那一个）
# ② macOS 整体 ad-hoc 重签（让 arm64 包从「已损坏」变回可右键打开的
#    「未验证开发者」——理由见 mac 段里的订正注释）。
# 为什么裁剪要在钩子里做而不是 files 排除：files 规则是静态的，做不到
# 「mac 包留 darwin-*、win 包留 win32-*」这种按目标平台的条件排除。
# 两个职责的完整背景见 scripts/after-pack.cjs 的头注释。
afterPack: scripts/after-pack.cjs

# ---------------------------------------------------------------------------
# 不用 asar
#
# daemon 通过 `utilityProcess.fork(join(import.meta.dirname, "daemon.mjs"))` 启动，
# 而 **asar 内的入口不是 utilityProcess.fork 能接受的真实文件路径**
# （electron#2708 / #41396）。asar:false 让 out/ 以真实文件形式落盘，
# 换来的是最可预期的行为 —— 代价只是启动时多几次文件读取。
# 这条是实测后定的，不是猜的。
# ---------------------------------------------------------------------------
asar: false

# koffi 是**预编译**的 N-API 模块（沙箱用它调 kernel32/advapi32），
# 没有需要重新编译的原生代码。关掉 rebuild 可以省下打包时的一大截时间，
# 也避免在 CI runner 上因为缺编译器而失败。
npmRebuild: false

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 不签名。没有 Developer ID 证书，签名与公证都做不到 ——
  # 这不是配置问题，是证书问题，文档里必须如实告诉用户怎么打开
  # （见 release.yml 组装发布说明时的开头那段提示；三处指引的落点与
  # 「为什么不去申请证书」的结论写在 .trellis/tasks/10-01-first-run-guidance/）。
  #
  # ⚠️ `identity: null` 的真实代价（2026-10-02 用户实测后订正，此前这里的判断是错的）：
  # 不做签名 → 上游 Electron 的 linker-signed 签名残留 → 我们的构建往 bundle 里
  # 加了 out/、resources/、node_modules/ 之后，那份签名的资源清单与实际不符 →
  # macOS 判定「签名损坏」，arm64 包双击直接弹「已损坏，移到废纸篓」，**且系统
  # 设置里没有「仍要打开」按钮**（那是「无法验证开发者」才有的）。Intel 包因走
  # Rosetta 躲过这条，所以现象上「Intel 能开、arm64 不能」（Intel 慢是另一回事）。
  #
  # 因此 `afterPack: scripts/after-pack.cjs` 里做了**整体 ad-hoc 重签**：
  # 判定随之变成正常的「未验证开发者」→ 右键「打开」可用。ad-hoc 不提供身份
  # 证明（仍会被 Gatekeeper 拦一次），它的作用只是让 bundle 结构自洽——
  # 而 Apple 芯片**强制要求 arm64 二进制签名自洽才肯执行**。
  # 完整实测记录见 docs/MAINTAINER_GUIDE.md 的「安装包签名」一节。
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64]

# `nsis` 在 electron-builder 26 里是**顶层键**，不是 `win.nsis` ——
# 写成 `win.nsis` 会被 schema 拒掉（报「must NOT have additional properties: nsis」，
# 而 CLI 只给出一句 "configuration.win should be one of these: null"，看不出所以然）。
# 这是实测出来的，不是照抄文档能得到的。
nsis:
  # 默认是一键装到用户目录且不给选；让用户能自选安装位置更友好
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ---------------------------------------------------------------------------
# Linux：**刻意不做**
#
# 命令沙箱依赖 Windows 专有的系统调用，托管 Bash 运行时也只面向 Windows。
# 在这个前提下发 Linux 包，等于对外承诺一个不成立的平台支持 ——
# 用户装完会发现「命令执行被拒」，而这是设计使然，不是 bug。
# 详见 README 的「平台支持」与 docs/USAGE.md。
# ---------------------------------------------------------------------------
linux: null

# publish：**只为生成更新元数据**（channel yml：稳定产 latest*.yml、channel=beta
# 产 beta*.yml），**不用于上传**——上传始终由 workflow 的 gh release upload 完成，
# 构建命令里的 `--publish never` 会拦住这里配置的 provider 不出门。
#
# 踩坑记录（beta 上线实测，三轮）：
#   · null —— 连 yml 都不生成（v0.3.0 的 Release 里没有任何 yml 可佐证）；
#   · never（yml 里写）—— 不是合法枚举，被当「自定义 publisher 模块名」：
#     `Cannot find module for publisher "never"`；
#   · 正解 = 真 provider（这里）+ CLI `--publish never`（build-installers.yml 已有）。
# app-update.yml 会随包写入这个 repo 信息——与运行时 setFeedURL 的目标一致，
# 即使哪条路径读了它也是对的。
publish:
  provider: github
  owner: liang-zhenxiang
  repo: zerowork
