<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			CSP 不写在这里，改由主进程按 dev/prod 分别下发（src/main/index.js）。
			原因：dev 模式下 @vitejs/plugin-react 会注入内联的 react-refresh preamble，
			静态 meta CSP 收紧 script-src 就会把它拦掉。
		-->
		<title>ZeroWork</title>
		<link rel="stylesheet" href="./src/app.css" />
		<!-- KaTeX 样式（公式渲染，issue #74；由 scripts/vendor-katex.mjs 生成，字体走同目录 katex-fonts/） -->
		<link rel="stylesheet" href="./src/katex.css" />
	</head>
	<body>
		<!-- #370 第二十一轮 F2：跳到主内容。Tab 首个到达（视觉隐藏，聚焦显现），
		     让键盘/读屏用户跳过侧栏导航直达内容区。目标 #main-content 由 App 结构标注。 -->
		<a class="skip-link" href="#main-content">跳到主内容</a>
		<!-- 启动品牌帧（issue #331 F5）：React 挂载前的静态层，避免白屏期。
		     样式内联（此时 app.css 已加载，但选择器挂 .splash-brand 亦可）；
		     app.js 首帧渲染后移除本层（见 app.js 移除逻辑）。 -->
		<div id="splash-brand" aria-hidden="true">
			<div class="splash-mark">Z</div>
		</div>
		<div id="root"></div>
		<script type="module" src="./src/app.js"></script>
	</body>
</html>
