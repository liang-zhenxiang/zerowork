name: ✨ 功能请求
description: 建议一个新功能或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提功能请求之前，请先看一眼
        [维护者手册的「项目定位与边界」](https://github.com/liangyuxiang/zerowork/blob/main/docs/MAINTAINER_GUIDE.md#项目定位与边界)
        —— 那一节列出了这个项目**明确不做**的事以及原因。
        落在「不做」里的需求，我们会在 Issue 里说明理由并关闭，而不是让它悬着。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 Discussions，确认没有重复
          required: true
        - label: 我读过项目定位与边界，「不做」清单里没有我要提的这件事
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的真实问题
      description: |
        **先讲问题，再讲方案。** 「我想要 X 功能」不如「我在做 Y 的时候被 Z 卡住了」有用 ——
        后者能让我们判断有没有更合适的解法。
      placeholder: |
        我在整理一个跨月的对账表时，需要把十几份 xlsx 的某个字段汇总起来，
        现在只能一份份打开复制，很费时间。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的解法
      description: 如果你有具体想法，写在这里。没有也没关系，讲清楚问题就够
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 包括「现在是怎么绕过去的」—— 现有绕法往往能提示我们该改哪里
    validations:
      required: false

  - type: dropdown
    id: willingness
    attributes:
      label: 你愿意参与实现吗
      description: 这不是承诺，只是让我们知道该把 Issue 标成什么状态
      options:
        - 我可以提 PR
        - 我可以帮忙测试与反馈
        - 我只是提个想法，没时间参与
    validations:
      required: true
