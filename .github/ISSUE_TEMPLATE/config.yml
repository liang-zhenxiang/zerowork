# Issue 模板选择器的配置
# 文档：https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

# 关闭空白 Issue：没有模板引导的 Issue 通常缺少复现信息，
# 来回到最后还是要补，不如一开始就引导走模板。
blank_issues_enabled: false

contact_links:
  - name: 🔒 报告安全漏洞
    url: https://github.com/liangyuxiang/zerowork/security/advisories/new
    about: 请勿通过公开 Issue 报告安全漏洞，使用这个私有渠道。威胁模型见 SECURITY.md。

  - name: 💬 提问与讨论
    url: https://github.com/liangyuxiang/zerowork/discussions
    about: 使用方式上的疑问、想法交流，欢迎到 Discussions，不必开 Issue。

  - name: 📚 排错文档
    url: https://github.com/liangyuxiang/zerowork/blob/main/docs/TROUBLESHOOTING.md
    about: 启动问题、命令执行被拒、文档解析异常等常见故障，先按报错原文在这里搜一遍。

  - name: 🧭 不知道走哪条？
    url: https://github.com/liangyuxiang/zerowork/blob/main/SUPPORT.md
    about: SUPPORT.md 把「文档 → Discussions → Bug → 安全报告」的分流写清楚了。
