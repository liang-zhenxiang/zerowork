# 工作流名称
name: Scorecard supply-chain security
# 工作流运行时显示名称
run-name: OSSF Scorecard 供应链安全评分

# 怎样触发工作流
on:
  # 维护分支保护规则时重新评分
  branch_protection_rule:
  # 每周六上午（UTC）例行评分，趋势在 Scorecard 页面可见
  schedule:
    - cron: "43 3 * * 6"
  push:
    branches: [main]

# 评分过程本身只需要读。声明 read-all 而不是放任默认（最小权限），
# Scorecard 自己也会检查这一项。
permissions: read-all

jobs:
  analysis:
    name: Scorecard 分析
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # 上传 SARIF 到 code scanning 需要写安全事件
      security-events: write
      # publish_results 通过 OIDC 向 Scorecard API 发布公开评分（README 徽章的数据来源）
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 运行分析
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # 公开发布评分：README 的 Scorecard 徽章依赖这一步。
          # 发布要求仓库为公开项目；若将来转为私有，这里要改回 false
          publish_results: true

      # 结果以 SARIF 上传到 code scanning，在 Security 页面可直接看到
      # 每一项检查的通过与建议 —— 它就是一份供应链安全的体检报告
      - name: 上传产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: 上传到 code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
